<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Eaglercraft Menu</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #222; color: white; padding-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <h1>Kies je Eaglercraft Versie</h1>
    <p>Klik op een knop om de game te openen in een overal onzichtbare about:blank pagina.</p>

    <!-- KNOP 1: Voor je eerste bestand -->
    <button onclick="openGame('eaglercraft-26.2.html')">Speel Eaglercraft 26.2</button>

    <!-- KNOP 2: Hier kun je een ander bestand invullen als je dat hebt -->
    <button onclick="openGame('andere-versie.html')">Speel Andere Versie</button>

    <script>
    function openGame(bestandsNaam) {
        // 1. Open een gloednieuw, leeg tabblad
        var win = window.open('about:blank', '_blank');
        
        if (win) {
            // 2. Zorg dat het hele scherm gebruikt wordt
            win.document.body.style.margin = "0";
            win.document.body.style.height = "100vh";
            win.document.body.style.overflow = "hidden";
            
            // 3. Maak een iframe die jouw specifieke HTML-bestand laadt
            var iframe = win.document.createElement('iframe');
            iframe.src = "https://github.io" + bestandsNaam;
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            
            // 4. Plaats de game in het lege tabblad
            win.document.body.appendChild(iframe);
        } else {
            alert("Pop-ups geblokkeerd! Klik rechtsboven in je browser op 'Pop-ups toestaan' om de game te starten.");
        }
    }
    </script>

</body>
</html>
